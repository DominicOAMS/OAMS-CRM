<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAMS CRM — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <img class="brand-logo" src="/logo" alt="OAMS CRM logo"
           onload="var f=document.getElementById('loginBrandFallback'); if (f) f.style.display='none';"
           onerror="this.style.display='none';">
      <div class="brand-logo brand-logo-fallback" id="loginBrandFallback" aria-hidden="true">O</div>
      <span class="login-brand-name">OAMS CRM</span>
    </div>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">
      <div class="form-field">
        <label class="form-label" for="username">Username</label>
        <input class="swal2-input" style="margin:0;" type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <input class="swal2-input" style="margin:0;" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn login-submit" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
