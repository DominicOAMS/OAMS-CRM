<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAMS CRM — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-glow login-glow-a"></div>
  <div class="login-glow login-glow-b"></div>

  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo-badge">
        <img class="login-logo-img" src="/logo" alt="OAMS CRM logo"
             onload="var f=document.getElementById('loginBrandFallback'); if (f) f.style.display='none';"
             onerror="this.style.display='none';">
        <span class="login-logo-fallback" id="loginBrandFallback" aria-hidden="true">O</span>
      </div>
      <span class="login-brand-name">OAMS CRM</span>
      <span class="login-brand-sub">Sign in to manage your accounts and sales</span>
    </div>

    {% if error %}
      <div class="login-error">
        {{ error }}
        <div class="login-error-hint">Contact your administrator if you can't sign in.</div>
      </div>
    {% endif %}

    <form method="POST" action="/login" class="login-form">
      <div class="form-field">
        <label class="form-label" for="username">Username</label>
        <div class="login-input-group">
          <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5 19.5c0-3.6 3-6 7-6s7 2.4 7 6"/></svg>
          <input class="login-input" type="text" id="username" name="username" placeholder="Username" autocomplete="username" autofocus required>
        </div>
      </div>
      <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <div class="login-input-group">
          <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <input class="login-input" type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </div>
      </div>
      <button class="btn login-submit" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
